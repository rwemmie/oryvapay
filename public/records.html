<!doctype html>
<html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){var t;try{t=localStorage.getItem('oryva-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})();</script>
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="/favicon.png" type="image/png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=Poppins:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<title>Intent Records · OryvaPay</title></head>
<body>
<main class="wrap">
  <section class="pagehead"><div><span class="eyebrow">Tamper evident evidence</span><h1>Intent <span class="g">Records</span></h1><p>Every purchase leaves a trail: what you asked for, what the agent picked, what the merchant charged, why OryvaPay allowed or blocked it, and what PayPal did with the money.</p></div><a class="btn primary" href="/app">Verify a purchase</a></section>
  <div class="stats" id="stats"></div>
  <section class="card" style="overflow:hidden"><div id="list"><div class="empty">Loading…</div></div></section>
  <div style="height:60px"></div>
</main>
<script type="module">
import { $, esc, usd, when, api, header, footer, statusLabel } from '/common.js';
await header('records'); footer();
const recs = await api('GET', '/api/records');
const n = s => recs.filter(r => r.status === s).length;
const stopped = recs.reduce((s, r) => s + (r.status === 'BLOCKED' ? 1 : 0) + Math.max(0, r.attempts - 1), 0);
$('#stats').innerHTML = [['acc', 'Intent Records', recs.length], ['okk', 'Captured after verification', n('CAPTURED')], ['badd', 'Bad orders stopped', stopped], ['revv', 'Waiting for your review', n('AWAITING_APPROVAL')]].map(([c, l, v]) => `<div class="stat ${c}"><div class="n">${v}</div><div class="l">${l}</div></div>`).join('');
$('#list').innerHTML = recs.length ? `<table class="recs"><thead><tr><th>Record</th><th>Buyer request</th><th>Mode</th><th>Attempts</th><th>Total</th><th>Status</th><th>Created</th></tr></thead><tbody>${recs.map(r => `<tr onclick="location.href='/record/${r.id}'"><td><code>${esc(r.id)}</code></td><td>${esc(r.request.length > 64 ? r.request.slice(0, 64) + '…' : r.request)}</td><td style="text-transform:capitalize">${esc(r.mode)}</td><td>${r.attempts}</td><td>${usd(r.total)}</td><td><span class="status ${r.status}">${statusLabel(r.status)}</span></td><td style="color:var(--muted)">${when(r.createdAt)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No records yet. <a href="/app">Verify your first purchase</a>.</div>';
</script>
</body></html>
